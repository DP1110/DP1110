name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 1 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/summary-cards.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # If you see "Resource not accessible by integration" or missing cards,
          # create a classic PAT and save it as repo secret SUMMARY_GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
