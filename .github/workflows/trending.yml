name: Update Trending

on:
  schedule:
    - cron: "30 2 * * *"  # daily, staggered from other workflows
  workflow_dispatch:

permissions:
  contents: write

# one commit-writing job at a time, so pushes never race
concurrency:
  group: profile-commits
  cancel-in-progress: false

jobs:
  trending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh trending table
        run: node scripts/update-trending.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: refresh trending table" && git pull --rebase && git push)
