name: Profile Assets

on:
  schedule:
    - cron: "15 1 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

# one commit-writing job at a time, so pushes never race
concurrency:
  group: profile-commits
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build animated cards (activity, stats, languages, projects)
        run: node scripts/build-stats.mjs
        env:
          # If this fails with a permissions error, create a classic PAT (read:user)
          # and save it as repo secret PROFILE_TOKEN.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Recolour everything in the active theme
        run: node scripts/apply-theme.mjs
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/src assets/theme themes.json README.md
          git diff --staged --quiet || (git commit -m "chore: refresh profile cards" && git pull --rebase && git push)
