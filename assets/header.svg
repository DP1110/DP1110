<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="DP1110 - AI, Cybersecurity, Embedded, Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080A"/>
      <stop offset="1" stop-color="#11191F"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="800" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="0.5" stop-color="#0099FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0;-600 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="waveFill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="0.5" stop-color="#0099FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;500 0;0 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0099FF" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)"/>

  <ellipse cx="500" cy="120" rx="380" ry="110" fill="url(#glow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="#3DEBFF">
    <circle cx="90"  cy="230" r="2"   opacity="0.6"><animate attributeName="cy" values="250;20" dur="7s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s"  repeatCount="indefinite"/></circle>
    <circle cx="240" cy="230" r="1.5" opacity="0.6"><animate attributeName="cy" values="250;30" dur="9s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s"  repeatCount="indefinite"/></circle>
    <circle cx="410" cy="230" r="2.5" opacity="0.6"><animate attributeName="cy" values="250;10" dur="6s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="6s"  repeatCount="indefinite"/></circle>
    <circle cx="600" cy="230" r="1.5" opacity="0.6"><animate attributeName="cy" values="250;25" dur="8s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s"  repeatCount="indefinite"/></circle>
    <circle cx="780" cy="230" r="2"   opacity="0.6"><animate attributeName="cy" values="250;15" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="230" r="2.5" opacity="0.6"><animate attributeName="cy" values="250;35" dur="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.5s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="0" y="0" width="1000" height="2" fill="#00D9FF" opacity="0.10">
    <animate attributeName="y" values="0;260" dur="5s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="84" font-weight="800" text-anchor="middle" letter-spacing="6">
    <text x="500" y="125" fill="#FF3CAC" opacity="0.5">DP1110
      <animate attributeName="x" values="500;500;507;494;500;500" keyTimes="0;0.88;0.9;0.93;0.95;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="125" fill="url(#flow)">DP1110
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
  </g>

  <text x="500" y="168" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="17" letter-spacing="5" fill="#9AA7AF">
    AI  ·  CYBERSECURITY  ·  EMBEDDED  ·  AUTOMATION
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
  </text>

  <path fill="url(#waveFill)" opacity="0.5" d="M0,205 C150,240 300,170 500,205 C700,240 850,170 1000,205 L1000,260 L0,260 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
      values="M0,205 C150,240 300,170 500,205 C700,240 850,170 1000,205 L1000,260 L0,260 Z;
              M0,205 C150,170 300,240 500,205 C700,170 850,240 1000,205 L1000,260 L0,260 Z;
              M0,205 C150,240 300,170 500,205 C700,240 850,170 1000,205 L1000,260 L0,260 Z"/>
  </path>
  <path fill="url(#waveFill)" d="M0,225 C170,195 330,255 520,225 C710,195 860,255 1000,225 L1000,260 L0,260 Z">
    <animate attributeName="d" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
      values="M0,225 C170,195 330,255 520,225 C710,195 860,255 1000,225 L1000,260 L0,260 Z;
              M0,225 C170,255 330,195 520,225 C710,255 860,195 1000,225 L1000,260 L0,260 Z;
              M0,225 C170,195 330,255 520,225 C710,195 860,255 1000,225 L1000,260 L0,260 Z"/>
  </path>
</svg>
