<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-label="Red team mindset. Blue team discipline. Purple team execution.">
  <defs>
    <linearGradient id="f" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00D9FF"/><stop offset="0.5" stop-color="#0099FF"/><stop offset="1" stop-color="#7C5CFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;500 0;0 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <path fill="url(#f)" opacity="0.45" d="M0,40 C150,10 300,70 500,40 C700,10 850,70 1000,40 L1000,120 L0,120 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
      values="M0,40 C150,10 300,70 500,40 C700,10 850,70 1000,40 L1000,120 L0,120 Z;
              M0,40 C150,70 300,10 500,40 C700,70 850,10 1000,40 L1000,120 L0,120 Z;
              M0,40 C150,10 300,70 500,40 C700,10 850,70 1000,40 L1000,120 L0,120 Z"/>
  </path>
  <path fill="url(#f)" d="M0,60 C170,35 330,85 520,60 C710,35 860,85 1000,60 L1000,120 L0,120 Z">
    <animate attributeName="d" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
      values="M0,60 C170,35 330,85 520,60 C710,35 860,85 1000,60 L1000,120 L0,120 Z;
              M0,60 C170,85 330,35 520,60 C710,85 860,35 1000,60 L1000,120 L0,120 Z;
              M0,60 C170,35 330,85 520,60 C710,35 860,85 1000,60 L1000,120 L0,120 Z"/>
  </path>
  <text x="500" y="98" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" font-weight="700" fill="#05080A" letter-spacing="1.5">RED TEAM MINDSET · BLUE TEAM DISCIPLINE · PURPLE TEAM EXECUTION</text>
